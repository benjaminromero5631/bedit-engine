name: B Edit quality checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Whisper runtime dependencies
        run: python -m pip install faster-whisper 'av<19'
      - name: Check Whisper decoder compatibility
        run: python scripts/transcriber-smoke.py
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: End-to-end smoke
        run: npm run smoke
